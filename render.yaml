services:
  - type: web
    name: tender-bot
    env: python
    plan: free
    pythonVersion: "3.11.9"
    buildCommand: |
      pip install -r requirements.txt
      playwright install chromium
      playwright install-deps chromium || true
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
